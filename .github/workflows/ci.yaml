name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (pytest) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11, 3.12]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Upgrade pip and install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" || pip install -e .
      - name: Run tests
        run: |
          pytest -q --maxfail=1
        env:
          PYTHONWARNINGS: "ignore::DeprecationWarning"

  lint:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (3.10)
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.10-${{ hashFiles('**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.10-

      - name: Upgrade pip and install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]" || pip install -e .

      - name: Run isort check
        run: isort --check-only .

      - name: Run black check
        run: black --check .

      - name: Run flake8
        run: flake8 .
